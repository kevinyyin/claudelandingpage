<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly To-Do</title>
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --muted: #9a9a9a;
    --card-bg: #121212;
    --card-border: #2c2c2c;
    --accent: #3399ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 48px 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    text-align: center;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 32px;
  }
  form.add-form {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  form.add-form input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
  }
  form.add-form input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  form.add-form button {
    padding: 12px 18px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000000;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  form.add-form button:hover {
    opacity: 0.9;
  }
  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  ul.tasks li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
  }
  ul.tasks li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  ul.tasks li span.text {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
  }
  ul.tasks li.done span.text {
    color: var(--muted);
    text-decoration: line-through;
  }
  ul.tasks li button.remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  ul.tasks li button.remove:hover {
    color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 24px;
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back:hover {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Weekly To-Do</h1>
  <div class="subtitle">What needs to get done this week</div>

  <form class="add-form" id="addForm">
    <input type="text" id="taskInput" placeholder="Add a task…" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <ul class="tasks" id="taskList"></ul>
  <div class="empty" id="emptyMessage" style="display:none;">Nothing on the list yet.</div>

  <a class="back" href="index.html">← Back to home</a>
</main>

<script>
  const STORAGE_KEY = "weeklyTodoTasks";

  function loadTasks() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveTasks(tasks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  let tasks = loadTasks();

  function render() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const li = document.createElement("li");
      if (task.done) li.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.addEventListener("change", () => {
        tasks[index].done = checkbox.checked;
        saveTasks(tasks);
        render();
      });

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = task.text;

      const removeBtn = document.createElement("button");
      removeBtn.className = "remove";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", () => {
        tasks.splice(index, 1);
        saveTasks(tasks);
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(removeBtn);
      list.appendChild(li);
    });

    document.getElementById("emptyMessage").style.display = tasks.length === 0 ? "block" : "none";
  }

  document.getElementById("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("taskInput");
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    saveTasks(tasks);
    input.value = "";
    render();
  });

  render();
</script>
</body>
</html>
