<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly To-Do</title>
<style>
  :root {
    --bg: #000000;
    --text: #f5f5f7;
    --muted: #86868b;
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.14);
    --accent: #2997ff;
    --tile-shadow: rgba(0,0,0,0.45);
  }
  :root[data-theme="light"] {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --glass: rgba(255,255,255,0.55);
    --glass-border: rgba(0,0,0,0.06);
    --accent: #0071e3;
    --tile-shadow: rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    transition: background 0.25s ease, color 0.25s ease;
    overflow-x: hidden;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient span {
    position: absolute;
    width: 42vw;
    height: 42vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.22;
    animation: drift 46s ease-in-out infinite alternate;
  }
  :root[data-theme="light"] .ambient span { opacity: 0.16; }
  .ambient span:nth-child(1) { background: #00c7be; top: -12%; right: -10%; }
  .ambient span:nth-child(2) { background: #0a84ff; bottom: -16%; left: -8%; animation-delay: -20s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4%, 6%) scale(1.12); }
  }

  .theme-toggle {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 2;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .theme-toggle:hover { transform: scale(1.06); }
  .theme-toggle:active { transform: scale(0.92); }
  .theme-toggle svg { width: 18px; height: 18px; }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 48px 24px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-align: center;
    margin: 0 0 6px;
  }
  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 36px;
  }
  form.add-form {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    padding: 6px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 14px;
  }
  form.add-form input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  form.add-form input[type="text"]::placeholder {
    color: var(--muted);
  }
  form.add-form button {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #ffffff;
    font-weight: 600;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.12s ease;
  }
  form.add-form button:hover {
    opacity: 0.85;
  }
  form.add-form button:active {
    opacity: 0.7;
  }
  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  ul.tasks li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 14px;
  }
  ul.tasks li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  ul.tasks li span.text {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
  }
  ul.tasks li.done span.text {
    color: var(--muted);
    text-decoration: line-through;
  }
  ul.tasks li button.remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  ul.tasks li button.remove:hover {
    color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 24px;
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 44px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back:hover, .back:focus-visible {
    color: var(--accent);
  }
  input:focus-visible,
  button:focus-visible,
  .back:focus-visible,
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  form.add-form:focus-within {
    border-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .ambient span { animation: none; }
    .theme-toggle { transition: none; }
  }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"><span></span><span></span></div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>

<main>
  <h1>Weekly To-Do</h1>
  <div class="subtitle">What needs to get done this week</div>

  <form class="add-form" id="addForm">
    <input type="text" id="taskInput" placeholder="Add a task…" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <ul class="tasks" id="taskList"></ul>
  <div class="empty" id="emptyMessage" style="display:none;">Nothing on the list yet.</div>

  <a class="back" href="index.html">← Back to home</a>
</main>

<script>
  const sunIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5" y1="5" x2="6.8" y2="6.8"/><line x1="17.2" y1="17.2" x2="19" y2="19"/><line x1="19" y1="5" x2="17.2" y2="6.8"/><line x1="6.8" y1="17.2" x2="5" y2="19"/></svg>`;
  const moonIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>`;

  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.innerHTML = theme === "light" ? sunIcon : moonIcon;
  }
  const savedTheme = localStorage.getItem("theme") ||
    (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    localStorage.setItem("theme", next);
    applyTheme(next);
  });

  const STORAGE_KEY = "weeklyTodoTasks";

  function loadTasks() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveTasks(tasks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  let tasks = loadTasks();

  function render() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const li = document.createElement("li");
      if (task.done) li.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.addEventListener("change", () => {
        tasks[index].done = checkbox.checked;
        saveTasks(tasks);
        render();
      });

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = task.text;

      const removeBtn = document.createElement("button");
      removeBtn.className = "remove";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", () => {
        tasks.splice(index, 1);
        saveTasks(tasks);
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(removeBtn);
      list.appendChild(li);
    });

    document.getElementById("emptyMessage").style.display = tasks.length === 0 ? "block" : "none";
  }

  document.getElementById("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("taskInput");
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    saveTasks(tasks);
    input.value = "";
    render();
  });

  render();
</script>
</body>
</html>
