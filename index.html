<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<style>
  :root {
    --bg: #1c1c1e;
    --text: #f2f2f2;
    --muted: #a0a0a5;
    --card-bg: #2a2a2d;
    --card-border: #3a3a3d;
    --accent: #6f9bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 640px;
    padding: 48px 24px;
  }
  #clock {
    text-align: center;
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  #greeting {
    text-align: center;
    font-size: 1rem;
    color: var(--muted);
    margin: 0 0 40px;
  }
  section.group {
    margin-bottom: 32px;
  }
  section.group h2 {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  ul.links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  ul.links li a {
    display: block;
    text-align: center;
    padding: 18px 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  ul.links li a:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
<main>
  <div id="clock"></div>
  <div id="greeting"></div>

  <section class="group">
    <h2>Work</h2>
    <ul class="links">
      <li><a href="https://notion.so" target="_blank">Notion</a></li>
      <li><a href="https://classroom.google.com" target="_blank">Google Classroom</a></li>
      <li><a href="https://docs.google.com" target="_blank">Google Docs</a></li>
    </ul>
  </section>

  <section class="group">
    <h2>Fun</h2>
    <ul class="links">
      <li><a href="https://youtube.com" target="_blank">YouTube</a></li>
    </ul>
  </section>

  <section class="group">
    <h2>Tools</h2>
    <ul class="links">
      <li><a href="https://mail.google.com" target="_blank">Gmail</a></li>
      <li><a href="https://claude.ai" target="_blank">Claude</a></li>
    </ul>
  </section>
</main>

<script>
  function pad(n) { return n.toString().padStart(2, "0"); }

  function update() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = pad(now.getMinutes());
    const seconds = pad(now.getSeconds());
    const ampm = hours >= 12 ? "PM" : "AM";
    const displayHours = hours % 12 === 0 ? 12 : hours % 12;
    document.getElementById("clock").textContent =
      `${displayHours}:${minutes}:${seconds} ${ampm}`;

    let greeting;
    if (hours < 12) greeting = "Good morning";
    else if (hours < 18) greeting = "Good afternoon";
    else greeting = "Good evening";
    document.getElementById("greeting").textContent = greeting;
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
