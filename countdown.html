<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move-In Countdown</title>
<style>
  :root {
    --bg: #000000;
    --text: #f5f5f7;
    --muted: #86868b;
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.14);
    --accent: #2997ff;
    --tile-shadow: rgba(0,0,0,0.45);
  }
  :root[data-theme="light"] {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --glass: rgba(255,255,255,0.55);
    --glass-border: rgba(0,0,0,0.06);
    --accent: #0071e3;
    --tile-shadow: rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    transition: background 0.25s ease, color 0.25s ease;
    overflow-x: hidden;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient span {
    position: absolute;
    width: 42vw;
    height: 42vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.22;
    animation: drift 46s ease-in-out infinite alternate;
  }
  :root[data-theme="light"] .ambient span { opacity: 0.16; }
  .ambient span:nth-child(1) { background: #af52de; top: -12%; left: -10%; }
  .ambient span:nth-child(2) { background: #0a84ff; bottom: -16%; right: -8%; animation-delay: -20s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4%, 6%) scale(1.12); }
  }

  .theme-toggle {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 2;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .theme-toggle:hover { transform: scale(1.06); }
  .theme-toggle:active { transform: scale(0.92); }
  .theme-toggle svg { width: 18px; height: 18px; }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 48px 24px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 44px;
  }
  .units {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .unit {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 16px;
    padding: 22px 8px;
  }
  .unit .value {
    font-size: 2.3rem;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .unit .label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 6px;
  }
  .done {
    font-size: 1.3rem;
    font-weight: 600;
    margin-top: 20px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 44px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back:hover, .back:focus-visible {
    color: var(--accent);
  }
  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 4px;
  }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ambient span { animation: none; }
    .theme-toggle { transition: none; }
  }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"><span></span><span></span></div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>

<main>
  <h1>Move-In Day</h1>
  <div class="subtitle">August 18, 2026 · 9:00 AM Eastern</div>

  <div class="units" id="units">
    <div class="unit">
      <div class="value" id="days">–</div>
      <div class="label">Days</div>
    </div>
    <div class="unit">
      <div class="value" id="hours">–</div>
      <div class="label">Hours</div>
    </div>
    <div class="unit">
      <div class="value" id="minutes">–</div>
      <div class="label">Minutes</div>
    </div>
    <div class="unit">
      <div class="value" id="seconds">–</div>
      <div class="label">Seconds</div>
    </div>
  </div>

  <div class="done" id="done" style="display:none;">You've moved in! 🎉</div>

  <a class="back" href="index.html">← Back to home</a>
</main>

<script>
  const sunIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5" y1="5" x2="6.8" y2="6.8"/><line x1="17.2" y1="17.2" x2="19" y2="19"/><line x1="19" y1="5" x2="17.2" y2="6.8"/><line x1="6.8" y1="17.2" x2="5" y2="19"/></svg>`;
  const moonIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>`;

  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.innerHTML = theme === "light" ? sunIcon : moonIcon;
  }
  const savedTheme = localStorage.getItem("theme") ||
    (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    localStorage.setItem("theme", next);
    applyTheme(next);
  });

  // 9:00 AM Eastern on Aug 18, 2026. Eastern is in daylight time (EDT, UTC-4) at that date.
  const target = new Date("2026-08-18T09:00:00-04:00");

  function update() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById("units").style.display = "none";
      document.getElementById("done").style.display = "block";
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
  }

  update();
  const timer = setInterval(update, 1000);
</script>
</body>
</html>
